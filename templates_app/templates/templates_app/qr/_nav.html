{% load static %}
<style>
    .qr-nav.nav-pills .nav-link.active,
    .qr-nav.nav-pills .show > .nav-link {
        background-color: var(--agri-red);
        color: #fff;
    }
</style>
<ul class="nav nav-pills qr-nav mb-4 gap-2">
    <li class="nav-item">
        <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="{% url 'qr_dashboard' %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active == 'dang_ky' %}active{% endif %}" href="{% url 'qr_registration_list' %}">
            <i class="bi bi-qr-code"></i> Đăng ký QR
        </a>
    </li>
    <li class="nav-item ms-auto">
        <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#qrHuongDanModal">
            <i class="bi bi-question-circle"></i> Hướng dẫn
        </button>
    </li>
</ul>

<!-- Modal: Hướng dẫn sử dụng -->
<div class="modal fade" id="qrHuongDanModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-question-circle"></i> Hướng dẫn sử dụng Đăng ký bảng QR</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                {% for heading, items in qr_huong_dan %}
                <h6 class="fw-bold" style="color: var(--agri-red);">{{ heading }}</h6>
                <ul>
                    {% for item in items %}<li>{{ item }}</li>{% endfor %}
                </ul>
                {% endfor %}
            </div>
            <div class="modal-footer">
                <a href="{% url 'qr_huong_dan' %}" class="btn btn-primary">
                    <i class="bi bi-file-earmark-word"></i> Tải file Word
                </a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>
