{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Address Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <h2 class="mb-4">🧪 Test Address Selector Component</h2>

        <div class="alert alert-info">
            <strong>Mục đích:</strong> Kiểm tra xem Address Selector Component có load và hoạt động không.
        </div>

        <hr>

        <h5>Chọn địa chỉ:</h5>

        <!-- Address Selector Container -->
        <div id="test-address-selector"></div>

        <!-- Hidden fields -->
        <input type="hidden" id="test-province" name="province">
        <input type="hidden" id="test-district" name="district">
        <input type="hidden" id="test-ward" name="ward">
        <input type="hidden" id="test-hamlet" name="hamlet">
        <input type="hidden" id="test-full-address" name="full_address">

        <!-- Preview -->
        <div class="alert alert-success mt-4" id="test-preview" style="display: none;">
            <strong>✓ Địa chỉ đã chọn:</strong>
            <div id="test-address-display" class="mt-2"></div>
        </div>

        <!-- Debug info -->
        <div class="debug-info">
            <strong>Debug Info:</strong><br>
            <div id="debug-log"></div>
        </div>

        <hr class="my-4">

        <a href="{% url 'dashboard' %}" class="btn btn-primary">← Quay lại Dashboard</a>
    </div>

    <!-- Load Address Selector Component -->
    <script src="{% static 'js/address_selector_component.js' %}"></script>

    <script>
        const debugLog = document.getElementById('debug-log');

        function log(message) {
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `[${time}] ${message}<br>`;
        }

        log('Page loaded');
        log('Checking if AddressSelector class exists: ' + (typeof AddressSelector !== 'undefined' ? 'YES ✓' : 'NO ✗'));

        document.addEventListener('DOMContentLoaded', function() {
            log('DOMContentLoaded event fired');

            if (typeof AddressSelector === 'undefined') {
                log('ERROR: AddressSelector class not found!');
                alert('ERROR: address_selector_component.js không load được!');
                return;
            }

            log('Initializing AddressSelector...');

            try {
                const selector = new AddressSelector('#test-address-selector', {
                    dataUrl: '{% static "data/dia_danh.json" %}',
                    showKhom: true,
                    labels: {
                        tinh: 'Tỉnh/Thành phố',
                        huyen: 'Quận/Huyện',
                        xa: 'Phường/Xã',
                        khom: 'Ấp/Khóm'
                    },
                    autoFill: function(fullAddress, parts) {
                        log('AutoFill triggered: ' + fullAddress);

                        // Fill hidden fields
                        document.getElementById('test-province').value = parts.province || '';
                        document.getElementById('test-district').value = parts.district || '';
                        document.getElementById('test-ward').value = parts.ward || '';
                        document.getElementById('test-hamlet').value = parts.hamlet || '';
                        document.getElementById('test-full-address').value = fullAddress || '';

                        // Show preview
                        if (fullAddress) {
                            document.getElementById('test-address-display').innerHTML =
                                `<strong style="color: green; font-size: 1.1em;">${fullAddress}</strong>`;
                            document.getElementById('test-preview').style.display = 'block';
                        } else {
                            document.getElementById('test-preview').style.display = 'none';
                        }
                    },
                    onLoad: function(instance) {
                        log('✓ Component loaded successfully!');
                        log('Data loaded. Total provinces: ' + Object.keys(instance.data || {}).length);
                    }
                });

                log('AddressSelector instance created');

            } catch (error) {
                log('ERROR: ' + error.message);
                console.error('Error initializing AddressSelector:', error);
            }
        });
    </script>
</body>
</html>
