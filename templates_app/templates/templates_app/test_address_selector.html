{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Address Selector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <h2 class="mb-4">🧪 Test Address Selector Component</h2>

        <div class="alert alert-info">
            <strong>Mục đích:</strong> Kiểm tra xem Address Selector Component có load và hoạt động không.
        </div>

        <hr>

        <h5>Chọn địa chỉ:</h5>

        <!-- Address Selector Container -->
        <div id="test-address-selector"></div>

        <!-- Hidden fields -->
        <input type="hidden" id="test-province" name="province">
        <input type="hidden" id="test-district" name="district">
        <input type="hidden" id="test-ward" name="ward">
        <input type="hidden" id="test-hamlet" name="hamlet">
        <input type="hidden" id="test-full-address" name="full_address">

        <!-- Preview -->
        <div class="alert alert-success mt-4" id="test-preview" style="display: none;">
            <strong>✓ Địa chỉ đã chọn:</strong>
            <div id="test-address-display" class="mt-2"></div>
            <button type="button" class="btn btn-sm btn-primary mt-2" id="btn-copy-address">
                <i class="bi bi-clipboard"></i> Copy địa chỉ
            </button>
        </div>

        <!-- Debug info -->
        <div class="debug-info">
            <strong>Debug Info:</strong><br>
            <div id="debug-log"></div>
        </div>

        <hr class="my-4">

        <a href="{% url 'dashboard' %}" class="btn btn-primary">← Quay lại Dashboard</a>
    </div>

    <!-- Load Address Selector Component -->
    <script src="{% static 'js/address_selector_component.js' %}"></script>

    <script>
        const debugLog = document.getElementById('debug-log');
        let addressConversionData = {}; // Store conversion mapping

        function log(message) {
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `[${time}] ${message}<br>`;
        }

        log('Page loaded');
        log('Checking if AddressSelector class exists: ' + (typeof AddressSelector !== 'undefined' ? 'YES ✓' : 'NO ✗'));

        // Load address conversion data
        log('Loading address conversion data...');
        fetch('{% static "data/chuyen_doi.json" %}')
            .then(response => response.json())
            .then(data => {
                addressConversionData = data;
                log('✓ Conversion data loaded: ' + Object.keys(data).length + ' mappings');
            })
            .catch(error => {
                log('✗ ERROR loading conversion data: ' + error.message);
                console.error('Error loading address conversion data:', error);
            });

        document.addEventListener('DOMContentLoaded', function() {
            log('DOMContentLoaded event fired');

            if (typeof AddressSelector === 'undefined') {
                log('ERROR: AddressSelector class not found!');
                alert('ERROR: address_selector_component.js không load được!');
                return;
            }

            log('Initializing AddressSelector...');

            try {
                const selector = new AddressSelector('#test-address-selector', {
                    dataUrl: '{% static "data/dia_danh.json" %}',
                    showKhom: true,
                    labels: {
                        tinh: 'Tỉnh/Thành phố',
                        huyen: 'Quận/Huyện',
                        xa: 'Phường/Xã',
                        khom: 'Ấp/Khóm'
                    },
                    autoFill: function(fullAddress, parts) {
                        log('AutoFill triggered - Old address: ' + fullAddress);

                        // CONVERSION LOGIC: Convert old address to new address
                        let newAddress = fullAddress;

                        if (fullAddress && addressConversionData[fullAddress]) {
                            newAddress = addressConversionData[fullAddress];
                            log('✓ Converted to NEW address: ' + newAddress);
                        } else if (fullAddress) {
                            log('⚠ No conversion mapping found - using old address as fallback');
                        }

                        // Fill hidden fields with CONVERTED address
                        document.getElementById('test-province').value = parts.province || '';
                        document.getElementById('test-district').value = parts.district || '';
                        document.getElementById('test-ward').value = parts.ward || '';
                        document.getElementById('test-hamlet').value = parts.hamlet || '';
                        document.getElementById('test-full-address').value = newAddress || '';

                        // Show preview with NEW CONVERTED address
                        if (newAddress) {
                            document.getElementById('test-address-display').innerHTML =
                                `<strong style="color: green; font-size: 1.1em;">${newAddress}</strong>`;
                            document.getElementById('test-preview').style.display = 'block';
                        } else {
                            document.getElementById('test-preview').style.display = 'none';
                        }
                    },
                    onLoad: function(instance) {
                        log('✓ Component loaded successfully!');
                        log('Data loaded. Total provinces: ' + Object.keys(instance.data || {}).length);
                    }
                });

                log('AddressSelector instance created');

            } catch (error) {
                log('ERROR: ' + error.message);
                console.error('Error initializing AddressSelector:', error);
            }
        });

        // Universal copy to clipboard function with fallback
        function copyToClipboard(text) {
            // Try modern Clipboard API first (only works on HTTPS or localhost)
            if (navigator.clipboard && window.isSecureContext && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text)
                    .then(() => {
                        console.log('Copied using Clipboard API');
                    });
            } else {
                // Fallback for browsers without Clipboard API or non-HTTPS contexts
                console.log('Using execCommand fallback');
                return new Promise((resolve, reject) => {
                    try {
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        // Make textarea visible but offscreen for better compatibility
                        textArea.style.position = 'fixed';
                        textArea.style.top = '0';
                        textArea.style.left = '0';
                        textArea.style.width = '2em';
                        textArea.style.height = '2em';
                        textArea.style.padding = '0';
                        textArea.style.border = 'none';
                        textArea.style.outline = 'none';
                        textArea.style.boxShadow = 'none';
                        textArea.style.background = 'transparent';
                        textArea.style.opacity = '0';

                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();

                        // Try to copy
                        let successful = false;
                        try {
                            successful = document.execCommand('copy');
                        } catch (err) {
                            console.error('execCommand error:', err);
                        }

                        document.body.removeChild(textArea);

                        if (successful) {
                            console.log('Copy succeeded via execCommand');
                            resolve();
                        } else {
                            console.error('execCommand returned false');
                            reject(new Error('execCommand copy failed'));
                        }
                    } catch (err) {
                        console.error('Copy fallback error:', err);
                        reject(err);
                    }
                });
            }
        }

        // Event Delegation - More reliable for CSP compliance
        document.addEventListener('click', function(e) {
            // Handle copy address button
            if (e.target.id === 'btn-copy-address' || e.target.closest('#btn-copy-address')) {
                e.preventDefault();
                const fullAddress = document.getElementById('test-full-address').value;

                if (!fullAddress) {
                    alert('Chưa có địa chỉ để copy!');
                    return;
                }

                const btn = e.target.closest('#btn-copy-address') || e.target;

                // Use universal copy function
                copyToClipboard(fullAddress).then(() => {
                    // Visual feedback
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="bi bi-check"></i> Đã copy!';
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-success');

                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-primary');
                    }, 2000);

                    log('✓ Copied address to clipboard: ' + fullAddress);
                }).catch(err => {
                    console.error('Failed to copy:', err);
                    alert('Lỗi khi copy địa chỉ!');
                    log('✗ ERROR copying to clipboard: ' + err.message);
                });
            }
        });
    </script>
</body>
</html>
