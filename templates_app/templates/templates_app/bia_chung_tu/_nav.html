<div class="row mb-3">
    <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h2 style="color: var(--agri-red);" class="mb-0"><i class="bi bi-journal-bookmark"></i> TẠO BÌA CHỨNG TỪ</h2>
        <div class="d-flex gap-2">
            <a href="{% url 'bia_chung_tu_list' %}" class="btn btn-sm {% if active == 'list' %}btn-danger{% else %}btn-outline-danger{% endif %}"><i class="bi bi-list-ul"></i> Danh sách</a>
            <a href="{% url 'bia_chung_tu_cap_so' %}" class="btn btn-sm {% if active == 'cap_so' %}btn-danger{% else %}btn-outline-danger{% endif %}"><i class="bi bi-plus-circle"></i> Cấp số theo ngày</a>
            <a href="{% url 'bia_chung_tu_import' %}" class="btn btn-sm {% if active == 'import' %}btn-danger{% else %}btn-outline-danger{% endif %}"><i class="bi bi-upload"></i> Import bìa cũ</a>
        </div>
    </div>
</div>
{% if not ipcas %}
<div class="alert alert-warning py-2"><i class="bi bi-exclamation-triangle"></i> Bạn chưa khai báo <b>Tài khoản IPCAS</b> trong hồ sơ nhân viên — chưa thể import bìa cũ (QR bìa import dùng UserIPCAS của người import). Cấp số theo ngày vẫn dùng được (QR lấy UserIPCAS của GDV).</div>
{% endif %}
