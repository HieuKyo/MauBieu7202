<div class="modal fade kh360-modal" id="kh360Modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-md-down">
        <div class="modal-content" id="kh360ModalContent"></div>
    </div>
</div>

<script>
(function () {
    const modalEl = document.getElementById('kh360Modal');
    const content = document.getElementById('kh360ModalContent');
    let modal;

    window.kh360Mo = function (url) {
        modal = modal || new bootstrap.Modal(modalEl);
        content.innerHTML = '<div class="p-5 text-center text-muted"><span class="spinner-border"></span><div class="mt-2">Đang tải…</div></div>';
        modal.show();
        fetch(url + (url.includes('?') ? '&' : '?') + 'modal=1', {credentials: 'same-origin'})
            .then(r => r.ok ? r.text() : Promise.reject(r.status))
            .then(html => { content.innerHTML = html; })
            .catch(() => { content.innerHTML = '<div class="p-5 text-center text-danger">Không tải được hồ sơ khách hàng.</div>'; });
    };

    // Nút/dòng có data-kh360="<url hồ sơ>" mở bảng nổi
    document.addEventListener('click', function (e) {
        const el = e.target.closest('[data-kh360]');
        if (!el) return;
        e.preventDefault();
        kh360Mo(el.dataset.kh360);
    });

    // Lưu ghi chú (cả trong bảng nổi lẫn trang hồ sơ)
    document.addEventListener('submit', function (e) {
        const form = e.target.closest('.js-ghi-chu');
        if (!form) return;
        e.preventDefault();
        const btn = form.querySelector('button[type=submit]');
        const info = form.querySelector('.js-ghi-chu-info');
        btn.disabled = true;
        fetch(form.action, {method: 'POST', body: new FormData(form), credentials: 'same-origin'})
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(d => { info.textContent = '✔ Đã lưu. ' + d.thong_tin; info.className = 'js-ghi-chu-info small text-success'; })
            .catch(() => { info.textContent = 'Lưu ghi chú thất bại.'; info.className = 'js-ghi-chu-info small text-danger'; })
            .finally(() => { btn.disabled = false; });
    });
})();
</script>
